# Publica a pasta apps-script/ no Google Apps Script sempre que ela muda.
# Secrets necessários (Settings → Secrets and variables → Actions):
#   CLASPRC_JSON   conteúdo do ficheiro ~/.clasprc.json (login do clasp)
#   PASTA_ID       ID da pasta do Google Drive
#   EMAIL_DESTINO  email(s) que recebem o relatório
#   CODIGO_ACESSO  PIN da aplicação
#   SCRIPT_ID      (depois da 1.ª publicação) ID do projeto Apps Script
#   DEPLOYMENT_ID  (depois da 1.ª publicação) ID da implementação da Aplicação Web
name: Publicar servidor (Apps Script)

on:
  push:
    branches: [main, claude/google-script-photos-pdf-bnvge3]
    paths: ['apps-script/**', '.github/workflows/servidor.yml']
  workflow_dispatch:

concurrency: servidor

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Verificar secrets
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          PASTA_ID: ${{ secrets.PASTA_ID }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          CODIGO_ACESSO: ${{ secrets.CODIGO_ACESSO }}
        run: |
          falta=""
          for v in CLASPRC_JSON PASTA_ID EMAIL_DESTINO CODIGO_ACESSO; do
            [ -z "${!v}" ] && falta="$falta $v"
          done
          if [ -n "$falta" ]; then
            echo "::error::Faltam os secrets:$falta (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Login do clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Gerar Segredos.gs (não fica no repositório)
        env:
          PASTA_ID: ${{ secrets.PASTA_ID }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          CODIGO_ACESSO: ${{ secrets.CODIGO_ACESSO }}
          WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
        run: |
          node -e '
            const s = { PASTA_ID: process.env.PASTA_ID, EMAIL_DESTINO: process.env.EMAIL_DESTINO,
                        CODIGO_ACESSO: process.env.CODIGO_ACESSO };
            if (process.env.WEB_APP_URL) s.WEB_APP_URL = process.env.WEB_APP_URL;
            require("fs").writeFileSync("apps-script/Segredos.gs",
              "// Gerado pelo GitHub Actions a partir dos Secrets. Não editar.\nObject.assign(CONFIG, " +
              JSON.stringify(s, null, 2) + ");\n");
          '

      - name: Projeto Apps Script
        env:
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          if [ -z "$SCRIPT_ID" ]; then
            # cria noutra pasta para o clasp não substituir o appsscript.json
            mkdir -p /tmp/novo && cd /tmp/novo
            clasp create --type standalone --title "Recolha de Serial Number"
            SCRIPT_ID=$(node -p 'require("./.clasp.json").scriptId')
            cd "$GITHUB_WORKSPACE"
            echo "NOVO_SCRIPT_ID=$SCRIPT_ID" >> "$GITHUB_ENV"
          fi
          # Codigo.gs tem de carregar antes de Segredos.gs
          node -e '
            require("fs").writeFileSync(".clasp.json", JSON.stringify({
              scriptId: process.argv[1], rootDir: "apps-script",
              filePushOrder: ["apps-script/Codigo.gs", "apps-script/Segredos.gs"]
            }));
          ' "$SCRIPT_ID"

      - name: Enviar código
        run: clasp push --force

      - name: Publicar Aplicação Web
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          DESC="GitHub ${GITHUB_SHA::7}"
          if [ -n "$DEPLOYMENT_ID" ]; then
            clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "$DESC"
          else
            SAIDA=$(clasp deploy --description "$DESC")
            echo "$SAIDA"
            DEPLOYMENT_ID=$(echo "$SAIDA" | grep -oE 'AKfy[A-Za-z0-9_-]+' | head -1)
            echo "NOVO_DEPLOYMENT_ID=$DEPLOYMENT_ID" >> "$GITHUB_ENV"
          fi
          echo "URL=https://script.google.com/macros/s/$DEPLOYMENT_ID/exec" >> "$GITHUB_ENV"

      - name: Resumo
        run: |
          {
            echo "## ✅ Servidor publicado"
            echo ""
            echo "**URL para a aplicação (Definições):** \`$URL\`"
            if [ -n "$NOVO_SCRIPT_ID" ] || [ -n "$NOVO_DEPLOYMENT_ID" ]; then
              echo ""
              echo "### ⚠️ 1.ª publicação — guarde estes valores como Secrets"
              echo "Para as próximas publicações atualizarem o mesmo projeto (e o URL não mudar):"
              echo ""
              [ -n "$NOVO_SCRIPT_ID" ] && echo "- \`SCRIPT_ID\` = \`$NOVO_SCRIPT_ID\`"
              [ -n "$NOVO_DEPLOYMENT_ID" ] && echo "- \`DEPLOYMENT_ID\` = \`$NOVO_DEPLOYMENT_ID\`"
              echo ""
              echo "Depois abra o projeto em https://script.google.com e execute a função **autorizar** uma vez."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
